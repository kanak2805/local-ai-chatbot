<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Local AI Chatbot</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="header-left">

            <button class="icon-btn">

                <i class="ri-menu-line"></i>

            </button>

            <div class="logo">

                🤖

            </div>

            <div class="brand">

                <h2>Local AI Chatbot</h2>

                <span>Powered by LangChain + OpenRouter</span>

            </div>

        </div>

        <div class="header-right">

    <button id="theme-toggle" class="icon-btn">

        <i id="theme-icon" class="ri-moon-line"></i>

    </button>

</div>

    </header>

    <!-- ================= CHAT ================= -->

    <main id="chat-container">

        <div class="welcome">

            <div class="welcome-icon">

                🤖

            </div>

            <h1>Local AI Chatbot</h1>

            <p>

                Ask me anything about AI, Programming,
                Python, SQL or General Knowledge.

            </p>

            <div class="suggestions">

                <button onclick="quickPrompt('Explain LangChain')">

                    Explain LangChain

                </button>

                <button onclick="quickPrompt('What is Prompt Engineering?')">

                    Prompt Engineering

                </button>

                <button onclick="quickPrompt('Explain RAG in simple words')">

                    Explain RAG

                </button>

            </div>

        </div>

    </main>

    <!-- ================= TYPING ================= -->

    <div id="typing" class="typing hidden">

        <div class="avatar ai-avatar">

            🤖

        </div>

        <div class="typing-box">

            <span></span>

            <span></span>

            <span></span>

        </div>

    </div>

    <!-- ================= INPUT ================= -->

    <footer>

        <div class="chat-input">

            <button class="attach">

                <i class="ri-attachment-2"></i>

            </button>

            <textarea

                id="message"

                rows="1"

                placeholder="Ask me anything..."

            ></textarea>

            <button id="sendBtn" class="send">

                <i class="ri-send-plane-fill"></i>

            </button>

        </div>

        <p class="footer-text">

            Press <b>Enter</b> to send &nbsp; • &nbsp;

            Shift + Enter for new line

        </p>

    </footer>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>

</body>

</html>
