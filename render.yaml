services:
  - type: web
    name: local-ai-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY
        sync: false          # set in Render dashboard (your OpenRouter key)
      - key: LANGCHAIN_API_KEY
        sync: false          # set in Render dashboard (your LangSmith key)
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: local-ai-chatbot
